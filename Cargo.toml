[package]
name = "cart"
version = "0.8.1"
edition = "2021"
authors = ["Dave Grantham <dwg@linuxprogrammer.org>"]
license = "Apache-2.0"
repository = "https://github.com/op-language/cart"
homepage = "https://github.com/op-language/cart"
description = "The Op build tool and package manager"

[[bin]]
name = "cart"
path = "src/main.rs"

[lib]
name = "cart"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
semver = "1"
git2 = { version = "0.21", features = ["https", "vendored-libgit2", "vendored-openssl"] }
sha2 = "0.11"
tempfile = "3"
dialoguer = "0.12"

[dev-dependencies]
tempfile = "3"
