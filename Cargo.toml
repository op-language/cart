[package]
name = "cart"
version = "0.1.0"
edition = "2021"
authors = ["Dave Grantham <dwg@linuxprogrammer.org>"]
license = "Apache-2.0"
repository = "https://github.com/op-language/cart"
homepage = "https://github.com/op-language/cart"
description = "The Op build tool and package manager"

[[bin]]
name = "cart"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"